name: stage5-second-source-selfpatch

on:
  push:
    branches:
      - stage5/second-source-layer-ui

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'Stage 5: run second source patch'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/second-source-layer-ui
      - name: Apply bounded Stage 5 patch
        run: python .github/stage5-second-source-patch.py
      - name: Commit patched Studio integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/i18n/locales/en.ts apps/web/src/i18n/locales/ja.ts
          git diff --cached --exit-code && { echo "Expected Stage 5 patch produced no diff"; exit 1; }
          git commit -m "Stage 5: wire independent second source layer"
          git push origin HEAD:stage5/second-source-layer-ui
