name: ci

on:
  push:
    branches: [main, stage5/second-source-animation-export]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded second-source animation patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/stage5/second-source-animation-export'
        run: |
          node scripts/stage5/patch-second-source-animation-export.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage 5: wire second source animation export"
          git push origin HEAD:stage5/second-source-animation-export
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for browser smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Development Preview Chromium smoke
        run: pnpm test:browser --project=chromium
      - name: Install WebKit for focused second-browser check
        run: pnpm exec playwright install --with-deps webkit
      - name: Run focused WebKit release-candidate check
        run: pnpm test:browser --project=webkit --grep "webkit second-browser critical"
      - name: Upload Development Preview visual and output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-evidence-${{ github.sha }}
          path: preview-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser candidate
        uses: actions/upload-artifact@v4
        with:
          name: browser-candidate-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
