name: ci

on:
  push:
    branches: [main, stage5/second-source-layer-ui]
  pull_request:
  workflow_dispatch:

jobs:
  stage5-compat-patch:
    if: "github.ref == 'refs/heads/stage5/second-source-layer-ui' && github.event.head_commit.message == 'Stage 5: apply compatibility patch'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/second-source-layer-ui
          fetch-depth: 0
      - name: Apply bounded compatibility patch
        run: python .github/stage5-second-source-compat-patch.py
      - name: Remove temporary patch plumbing
        run: |
          git rm .github/stage5-second-source-compat-patch.py
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx .github/workflows/ci.yml
          git diff --cached --exit-code && { echo "Expected compatibility patch produced no diff"; exit 1; }
          git commit -m "Fix: preserve single-source Studio contracts"
          git push origin HEAD:stage5/second-source-layer-ui

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for browser smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Development Preview Chromium smoke
        run: pnpm test:browser --project=chromium
      - name: Install WebKit for focused second-browser check
        run: pnpm exec playwright install --with-deps webkit
      - name: Run focused WebKit release-candidate check
        run: pnpm test:browser --project=webkit --grep "webkit second-browser critical"
      - name: Upload Development Preview visual and output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-evidence-${{ github.sha }}
          path: preview-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser candidate
        uses: actions/upload-artifact@v4
        with:
          name: browser-candidate-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
