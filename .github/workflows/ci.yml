name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for browser smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Development Preview Chromium smoke
        run: pnpm test:browser --project=chromium
      - name: Install Firefox for focused second-browser check
        run: pnpm exec playwright install --with-deps firefox
      - name: Run focused Firefox release-candidate check
        run: pnpm test:browser --project=firefox --grep "second-browser critical"
      - name: Upload Development Preview visual and output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-evidence-${{ github.sha }}
          path: preview-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser candidate
        uses: actions/upload-artifact@v4
        with:
          name: browser-candidate-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
