name: stage4-fix-panel-contract-once

on:
  push:
    paths:
      - .github/workflows/stage4-fix-panel-contract-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4/procedural-source-ui
      - name: Align panel import and props
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/main.tsx')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { ProceduralSourcePanel } from "./components/ProceduralSourcePanel";',
              'import { ProceduralSourcePanel } from "./procedural/ProceduralSourcePanel";'
          )
          replace_once(
              '<ProceduralSourcePanel disabled={animationExporting} t={t} onGenerate={useProceduralSource} />',
              '''<ProceduralSourcePanel\n          disabled={animationExporting}\n          labels={{\n            title: t("procedural.title"),\n            description: t("procedural.description"),\n            create: t("procedural.create"),\n            count: t("procedural.count"),\n            scale: t("procedural.scale"),\n            sphere: t("procedural.sphere"),\n            torus: t("procedural.torus"),\n            grid: t("procedural.grid"),\n            spiral: t("procedural.spiral"),\n          }}\n          onCreate={({ kind, field: generatedField }) => useProceduralSource(kind, generatedField)}\n        />'''
          )
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/stage4-fix-panel-contract-once.yml
      - name: Commit contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx .github/workflows/stage4-fix-panel-contract-once.yml
          git commit -m "Align procedural source panel contract"
          git push origin HEAD:stage4/procedural-source-ui
