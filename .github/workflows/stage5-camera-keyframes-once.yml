name: stage5-camera-keyframes-once

on:
  push:
    branches: [stage5/camera-keyframes]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/camera-keyframes
      - name: Apply Camera keyframe integration
        run: python scripts/stage5_camera_keyframes_once.py
      - name: Remove one-shot files and commit implementation
        run: |
          rm scripts/stage5_camera_keyframes_once.py
          rm .github/workflows/stage5-camera-keyframes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/timeline.ts packages/core/src/timeline.test.ts apps/web/src/main.tsx apps/web/src/i18n/locales/en.ts apps/web/src/i18n/locales/ja.ts tests/browser/stage5-camera-keyframes.spec.ts scripts/stage5_camera_keyframes_once.py .github/workflows/stage5-camera-keyframes-once.yml
          git commit -m "Stage 5: animate Camera with keyframes"
          git push origin HEAD:stage5/camera-keyframes
