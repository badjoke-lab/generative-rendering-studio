name: stage5-morph-track-once

on:
  push:
    branches: [stage5/morph-track]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/morph-track
      - name: Apply Morph Track integration
        run: python scripts/stage5_morph_track_once.py
      - name: Remove one-shot files and commit implementation
        run: |
          rm scripts/stage5_morph_track_once.py
          rm .github/workflows/stage5-morph-track-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/timeline.ts packages/core/src/timeline.test.ts apps/web/src/main.tsx apps/web/src/webgl/WebGLPreview.tsx apps/web/src/i18n/locales/en.ts apps/web/src/i18n/locales/ja.ts tests/browser/stage5-morph-track.spec.ts scripts/stage5_morph_track_once.py .github/workflows/stage5-morph-track-once.yml
          git commit -m "Stage 5: promote Morph to Timeline track"
          git push origin HEAD:stage5/morph-track
