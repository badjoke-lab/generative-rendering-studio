name: stage5-video-layer-ui-once

on:
  push:
    paths:
      - .github/workflows/stage5-video-layer-ui-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/video-layer-ui
      - name: Wire layer controls, blend preview/export, and translations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          main = 'apps/web/src/main.tsx'
          replace_once(
              main,
              'import { VideoCompositePreview } from "./canvas/VideoCompositePreview";\nimport { composeCanvasLayers } from "./export/composeCanvasLayers";',
              'import { VideoCompositePreview } from "./canvas/VideoCompositePreview";\nimport { composeCanvasStack } from "./export/composeCanvasLayers";\nimport { VideoLayerStackPanel, type VideoLayerBlendMode } from "./studio/VideoLayerStackPanel";',
              'main imports',
          )
          replace_once(
              main,
              '  const [videoCompositeOriginal, setVideoCompositeOriginal] = useState(false);\n  const [videoOriginalOpacity, setVideoOriginalOpacity] = useState(0.55);',
              '  const [videoCompositeOriginal, setVideoCompositeOriginal] = useState(false);\n  const [videoOriginalOpacity, setVideoOriginalOpacity] = useState(0.55);\n  const [videoBlendMode, setVideoBlendMode] = useState<VideoLayerBlendMode>("normal");',
              'video layer state',
          )
          replace_once(
              main,
              '    setVideoTime(0);\n    setVideoCompositeOriginal(false);',
              '    setVideoTime(0);\n    setVideoCompositeOriginal(false);\n    setVideoBlendMode("normal");',
              'video layer reset',
          )
          replace_once(
              main,
              '    const exportCanvas = isVideoComposite && originalUnderlayCanvas.current\n      ? composeCanvasLayers(originalUnderlayCanvas.current, canvas, videoOriginalOpacity)\n      : canvas;',
              '    const exportCanvas = isVideoComposite && originalUnderlayCanvas.current\n      ? composeCanvasStack([\n          { canvas: originalUnderlayCanvas.current, opacity: videoOriginalOpacity, blendMode: "normal" },\n          { canvas, blendMode: videoBlendMode },\n        ])\n      : canvas;',
              'layer-aware still export',
          )
          replace_once(
              main,
              'originalOpacity={videoOriginalOpacity} positions={previewPositions}',
              'originalOpacity={videoOriginalOpacity} transformedBlendMode={videoBlendMode} positions={previewPositions}',
              'composite preview blend prop',
          )

          inspector_anchor = '      <aside className="inspector-panel">\n        <section className="inspector-section guided-section">'
          inspector_insert = chr(10).join([
              '      <aside className="inspector-panel">',
              '        {isVideoSource && rendererMode !== "original" && <VideoLayerStackPanel',
              '          disabled={animationExporting}',
              '          originalVisible={videoCompositeOriginal}',
              '          originalOpacity={videoOriginalOpacity}',
              '          transformedBlendMode={videoBlendMode}',
              '          labels={{',
              '            title: t("layer.title"),',
              '            summary: t("layer.videoComposition"),',
              '            original: t("layer.original"),',
              '            transformed: t("layer.transformed"),',
              '            visible: t("layer.visible"),',
              '            opacity: t("layer.opacity"),',
              '            blend: t("layer.blend"),',
              '            normal: t("layer.normal"),',
              '            multiply: t("layer.multiply"),',
              '            screen: t("layer.screen"),',
              '          }}',
              '          onOriginalVisibleChange={setVideoCompositeOriginal}',
              '          onOriginalOpacityChange={setVideoOriginalOpacity}',
              '          onTransformedBlendModeChange={setVideoBlendMode}',
              '        />}',
              '        <section className="inspector-section guided-section">',
          ])
          replace_once(main, inspector_anchor, inspector_insert, 'layer panel insertion')

          p = Path(main)
          text = p.read_text()
          pattern = re.compile(
              r'\{isVideoSource && rendererMode !== "original" && <><div className="toggle-row"><span>\{t\("video\.compositeOriginal"\)\}</span><button aria-label=\{t\("video\.compositeOriginal"\)\} disabled=\{animationExporting\} className=\{`toggle \$\{videoCompositeOriginal \? "on" : ""\}`\} aria-pressed=\{videoCompositeOriginal\} onClick=\{\(\) => setVideoCompositeOriginal\(\(value\) => !value\)\} /></div>\{videoCompositeOriginal && <label>\{t\("video\.originalOpacity"\)\}<div className="range-row"><input aria-label=\{t\("video\.originalOpacity"\)\} type="range" min="0" max="100" value=\{Math\.round\(videoOriginalOpacity \* 100\)\} disabled=\{animationExporting\} onChange=\{\(e\) => setVideoOriginalOpacity\(Number\(e\.target\.value\) / 100\)\} /><output>\{Math\.round\(videoOriginalOpacity \* 100\)\}%</output></div></label>\}\{hasVideoMask &&'
          )
          text, count = pattern.subn('{isVideoSource && rendererMode !== "original" && <>{hasVideoMask &&', text, count=1)
          if count != 1:
              raise SystemExit(f'legacy video composite controls: expected 1 match, found {count}')
          p.write_text(text)

          en_insert = chr(10).join([
              '  "layer.mainRender": "Main Render",',
              '  "layer.videoComposition": "Video composition",',
              '  "layer.original": "Original",',
              '  "layer.transformed": "Transformed",',
              '  "layer.visible": "Visibility",',
              '  "layer.opacity": "Opacity",',
              '  "layer.blend": "Blend mode",',
              '  "layer.normal": "Normal",',
              '  "layer.multiply": "Multiply",',
              '  "layer.screen": "Screen",',
          ])
          replace_once('apps/web/src/i18n/locales/en.ts', '  "layer.mainRender": "Main Render",', en_insert, 'EN layer keys')

          ja_insert = chr(10).join([
              '  "layer.mainRender": "メインレンダー",',
              '  "layer.videoComposition": "動画の2レイヤー合成",',
              '  "layer.original": "元動画",',
              '  "layer.transformed": "変換レイヤー",',
              '  "layer.visible": "表示",',
              '  "layer.opacity": "不透明度",',
              '  "layer.blend": "合成モード",',
              '  "layer.normal": "通常",',
              '  "layer.multiply": "乗算",',
              '  "layer.screen": "スクリーン",',
          ])
          replace_once('apps/web/src/i18n/locales/ja.ts', '  "layer.mainRender": "メインレンダー",', ja_insert, 'JA layer keys')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/stage5-video-layer-ui-once.yml
      - name: Commit layer integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/i18n/locales/en.ts apps/web/src/i18n/locales/ja.ts .github/workflows/stage5-video-layer-ui-once.yml
          git commit -m "Stage 5: wire video layer stack UI"
          git push origin HEAD:stage5/video-layer-ui
