name: stage4-flow-noise-ui-once

on:
  push:
    paths:
      - .github/workflows/stage4-flow-noise-ui-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4/flow-noise-ui
      - name: Extend procedural source UI to flow and noise forms
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} matches: {count}')
              return text.replace(old, new, 1)

          panel = Path('apps/web/src/procedural/ProceduralSourcePanel.tsx')
          text = panel.read_text()
          text = replace_once(text, 'type ProceduralSourceKind,', 'type GeneratedProceduralSourceKind,', 'panel import type')
          text = replace_once(text, 'readonly spiral: string;\n}', 'readonly spiral: string;\n  readonly wave: string;\n  readonly ribbon: string;\n  readonly vortex: string;\n  readonly noise: string;\n}', 'panel labels')
          text = replace_once(text, 'readonly kind: ProceduralSourceKind;', 'readonly kind: GeneratedProceduralSourceKind;', 'selection kind')
          text = replace_once(text, 'const kinds: readonly ProceduralSourceKind[] = ["sphere", "torus", "grid", "spiral"];', 'const kinds: readonly GeneratedProceduralSourceKind[] = ["sphere", "torus", "grid", "spiral", "wave", "ribbon", "vortex", "noise"];', 'kinds')
          text = replace_once(text, 'useState<ProceduralSourceKind>("sphere")', 'useState<GeneratedProceduralSourceKind>("sphere")', 'kind state')
          old_labels = '''  const kindLabels = useMemo<Record<ProceduralSourceKind, string>>(() => ({\n    sphere: labels.sphere,\n    torus: labels.torus,\n    grid: labels.grid,\n    spiral: labels.spiral,\n  }), [labels.grid, labels.spiral, labels.sphere, labels.torus]);'''
          new_labels = '''  const kindLabels = useMemo<Record<GeneratedProceduralSourceKind, string>>(() => ({\n    sphere: labels.sphere,\n    torus: labels.torus,\n    grid: labels.grid,\n    spiral: labels.spiral,\n    wave: labels.wave,\n    ribbon: labels.ribbon,\n    vortex: labels.vortex,\n    noise: labels.noise,\n  }), [labels.grid, labels.noise, labels.ribbon, labels.spiral, labels.sphere, labels.torus, labels.vortex, labels.wave]);'''
          text = replace_once(text, old_labels, new_labels, 'label map')
          panel.write_text(text)

          main = Path('apps/web/src/main.tsx')
          text = main.read_text()
          text = replace_once(text, '  type ProceduralSourceKind,', '  type GeneratedProceduralSourceKind,', 'main type import')
          text = replace_once(text, 'useState<ProceduralSourceKind>();', 'useState<GeneratedProceduralSourceKind>();', 'main state type')
          text = replace_once(text, 'const proceduralLabel = (kind: ProceduralSourceKind) => {', 'const proceduralLabel = (kind: GeneratedProceduralSourceKind) => {', 'label function type')
          text = replace_once(text, 'const useProceduralSource = (kind: ProceduralSourceKind, generatedField: PointField) => {', 'const useProceduralSource = (kind: GeneratedProceduralSourceKind, generatedField: PointField) => {', 'source function type')
          old_switch = '''        case "sphere": setSourceLabel(t("procedural.sphere")); break;\n        case "torus": setSourceLabel(t("procedural.torus")); break;\n        case "grid": setSourceLabel(t("procedural.grid")); break;\n        case "spiral": setSourceLabel(t("procedural.spiral")); break;'''
          new_switch = old_switch + '''\n        case "wave": setSourceLabel(t("procedural.wave")); break;\n        case "ribbon": setSourceLabel(t("procedural.ribbon")); break;\n        case "vortex": setSourceLabel(t("procedural.vortex")); break;\n        case "noise": setSourceLabel(t("procedural.noise")); break;'''
          text = replace_once(text, old_switch, new_switch, 'locale switch')
          old_label_switch = '''      case "sphere": return t("procedural.sphere");\n      case "torus": return t("procedural.torus");\n      case "grid": return t("procedural.grid");\n      case "spiral": return t("procedural.spiral");'''
          new_label_switch = old_label_switch + '''\n      case "wave": return t("procedural.wave");\n      case "ribbon": return t("procedural.ribbon");\n      case "vortex": return t("procedural.vortex");\n      case "noise": return t("procedural.noise");'''
          text = replace_once(text, old_label_switch, new_label_switch, 'procedural label switch')
          old_props = '''            grid: t("procedural.grid"),\n            spiral: t("procedural.spiral"),'''
          new_props = old_props + '''\n            wave: t("procedural.wave"),\n            ribbon: t("procedural.ribbon"),\n            vortex: t("procedural.vortex"),\n            noise: t("procedural.noise"),'''
          text = replace_once(text, old_props, new_props, 'panel props')
          main.write_text(text)

          en = Path('apps/web/src/i18n/locales/en.ts')
          text = en.read_text()
          anchor = '  "procedural.spiral": "Spiral",\n'
          text = replace_once(text, anchor, anchor + '  "procedural.wave": "Wave",\n  "procedural.ribbon": "Ribbon",\n  "procedural.vortex": "Vortex",\n  "procedural.noise": "Noise",\n', 'EN keys')
          en.write_text(text)

          ja = Path('apps/web/src/i18n/locales/ja.ts')
          text = ja.read_text()
          anchor = '  "procedural.spiral": "スパイラル",\n'
          text = replace_once(text, anchor, anchor + '  "procedural.wave": "ウェーブ",\n  "procedural.ribbon": "リボン",\n  "procedural.vortex": "渦",\n  "procedural.noise": "ノイズ",\n', 'JA keys')
          ja.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/stage4-flow-noise-ui-once.yml
      - name: Commit UI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/procedural/ProceduralSourcePanel.tsx apps/web/src/i18n/locales/en.ts apps/web/src/i18n/locales/ja.ts .github/workflows/stage4-flow-noise-ui-once.yml
          git commit -m "Stage 4: expose flow and noise procedural sources"
          git push origin HEAD:stage4/flow-noise-ui
