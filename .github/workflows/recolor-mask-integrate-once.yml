name: recolor-mask-integrate-once

on:
  push:
    branches:
      - fix/recolor-preserve-structure

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recolor-preserve-structure
          fetch-depth: 0
      - name: Wire tonal recolor mask into WebGL preview
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/web/src/webgl/WebGLPreview.tsx')
          text = path.read_text()
          old_import = 'import { buildStableGlyphIndices, type GlyphPreset } from "./stableGlyphs";\n'
          new_import = old_import + 'import { buildRecolorMaskedColors } from "./recolorMask";\n'
          assert old_import in text and 'buildRecolorMaskedColors' not in text
          text = text.replace(old_import, new_import, 1)

          old_block = '''    const sourceColors = colors && colors.length === count * 4 ? colors : buildFallbackColors(count);\n    const targetPoints = targetPositions && targetPositions.length === points.length ? targetPositions : points;\n    const targetSourceColors = targetColors && targetColors.length === sourceColors.length ? targetColors : sourceColors;\n    const glyphs = buildStableGlyphIndices(points, sourceColors, glyphPreset);\n\n    const positionBuffer = bindFloatBuffer(gl, program, "a_position", points, 2);\n    const targetPositionBuffer = bindFloatBuffer(gl, program, "a_target_position", targetPoints, 2);\n    const colorBuffer = bindFloatBuffer(gl, program, "a_color", sourceColors, 4);\n    const targetColorBuffer = bindFloatBuffer(gl, program, "a_target_color", targetSourceColors, 4);\n'''
          new_block = '''    const sourceColors = colors && colors.length === count * 4 ? colors : buildFallbackColors(count);\n    const targetPoints = targetPositions && targetPositions.length === points.length ? targetPositions : points;\n    const targetSourceColors = targetColors && targetColors.length === sourceColors.length ? targetColors : sourceColors;\n    const displaySourceColors = useSourceColor ? sourceColors : buildRecolorMaskedColors(sourceColors);\n    const displayTargetColors = useSourceColor ? targetSourceColors : buildRecolorMaskedColors(targetSourceColors);\n    const glyphs = buildStableGlyphIndices(points, sourceColors, glyphPreset);\n\n    const positionBuffer = bindFloatBuffer(gl, program, "a_position", points, 2);\n    const targetPositionBuffer = bindFloatBuffer(gl, program, "a_target_position", targetPoints, 2);\n    const colorBuffer = bindFloatBuffer(gl, program, "a_color", displaySourceColors, 4);\n    const targetColorBuffer = bindFloatBuffer(gl, program, "a_target_color", displayTargetColors, 4);\n'''
          assert old_block in text
          text = text.replace(old_block, new_block, 1)
          path.write_text(text)
      - name: Remove one-shot workflow
        run: rm .github/workflows/recolor-mask-integrate-once.yml
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/webgl/WebGLPreview.tsx .github/workflows/recolor-mask-integrate-once.yml
          git commit -m "Fix: preserve tonal structure in render-color mode"
          git push origin HEAD:fix/recolor-preserve-structure
