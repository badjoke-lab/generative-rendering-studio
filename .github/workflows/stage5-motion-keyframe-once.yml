name: stage5-motion-keyframe-once

on:
  push:
    branches:
      - stage5/motion-keyframe-timeline

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/motion-keyframe-timeline
          fetch-depth: 0
      - name: Wire Motion keyframe timeline
        run: python .github/scripts/stage5_motion_keyframe_once.py
      - name: Commit integrated slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx apps/web/src/webgl/WebGLPreview.tsx apps/web/src/i18n/locales/en.ts apps/web/src/i18n/locales/ja.ts tests/browser/stage5-motion-keyframe-timeline.spec.ts
          git rm .github/workflows/stage5-motion-keyframe-once.yml .github/scripts/stage5_motion_keyframe_once.py
          git commit -m "Stage 5: wire Motion keyframe timeline"
          git push
