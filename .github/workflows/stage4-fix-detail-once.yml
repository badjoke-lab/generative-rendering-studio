name: stage4-fix-detail-once

on:
  push:
    paths:
      - .github/workflows/stage4-fix-detail-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4/procedural-source-ui
      - name: Use existing procedural detail translation key
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/main.tsx')
          text = path.read_text()
          old = 'setSourceDetail(t("procedural.generatedDetail"));'
          new = 'setSourceDetail(t("procedural.detail"));'
          if text.count(old) != 1:
              raise SystemExit(f'expected one detail-key match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/stage4-fix-detail-once.yml
      - name: Commit detail-key fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx .github/workflows/stage4-fix-detail-once.yml
          git commit -m "Use procedural source detail translation"
          git push origin HEAD:stage4/procedural-source-ui
