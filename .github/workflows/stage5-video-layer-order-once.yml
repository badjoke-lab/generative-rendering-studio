name: stage5-video-layer-order-once

on:
  push:
    branches:
      - stage5/video-layer-order

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/video-layer-order
      - name: Apply video layer order integration
        run: python scripts/stage5_video_layer_order_once.py
      - name: Remove one-shot files and commit implementation
        run: |
          rm .github/workflows/stage5-video-layer-order-once.yml
          rm scripts/stage5_video_layer_order_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage 5: reorder video layers"
          git push origin HEAD:stage5/video-layer-order
