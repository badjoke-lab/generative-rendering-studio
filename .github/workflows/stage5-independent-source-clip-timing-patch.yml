name: stage5-independent-source-clip-timing-patch

on:
  push:
    branches:
      - stage5/independent-source-clip-timing

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/independent-source-clip-timing
      - name: Apply bounded independent source clip timing patch
        run: node scripts/stage5/patch-independent-source-clip-timing.mjs
      - name: Commit generated implementation and remove patch machinery
        run: |
          rm scripts/stage5/patch-independent-source-clip-timing.mjs
          rm .github/workflows/stage5-independent-source-clip-timing-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage 5: wire independent source clip timing"
          git push
