name: stage5-morph-regression-fix-once

on:
  push:
    branches: [stage5/morph-track]
    paths:
      - .github/workflows/stage5-morph-regression-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/morph-track
          fetch-depth: 0
      - name: Update stale Morph regression and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/development-preview.spec.ts')
          text = path.read_text()
          old = '''  await expect(toggle).toHaveAttribute("aria-pressed", "true");\n  await expect(page.getByText("Stage 2 morph preview")).toBeVisible();\n\n  const timeline = page.getByLabel("Timeline position");'''
          new = '''  await expect(toggle).toHaveAttribute("aria-pressed", "true");\n  const transport = page.locator(".transport-bar");\n  await expect(transport).toHaveAttribute("data-timeline-mode", "morph-track");\n\n  const timeline = transport.locator('input[type="range"]');'''
          if old not in text:
              raise SystemExit('stale Morph regression block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/stage5-morph-regression-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/browser/development-preview.spec.ts
          git commit -m "Test formal Morph Track transport contract"
          git push origin HEAD:stage5/morph-track
