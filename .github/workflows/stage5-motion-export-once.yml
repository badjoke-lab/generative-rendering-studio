name: stage5-motion-export-once

on:
  push:
    branches:
      - stage5/motion-animation-export
    paths:
      - .github/workflows/stage5-motion-export-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/motion-animation-export
      - name: Generalize short animation export
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          main = "apps/web/src/main.tsx"
          replace(main,
              '  const [motionSpeed, setMotionSpeed] = useState(1);\n',
              '  const [motionSpeed, setMotionSpeed] = useState(1);\n  const [motionDuration, setMotionDuration] = useState(3);\n')

          old_export = '''  const exportMorphAnimation = async () => {\n    const canvas = previewCanvas.current;\n    if (!canvas || !field || !morphField || rendererMode === "original" || isVideoSource) return;\n    const capability = getCanvasRecordingCapability(canvas);\n    setAnimationCapability(capability);\n    if (!capability.supported) {\n      setAnimationExportError(t("export.animationUnsupported"));\n      setAnimationExportSucceeded(false);\n      return;\n    }\n    setAnimationExportError(null);\n    setAnimationExportSucceeded(false);\n    setAnimationExporting(true);\n    setMorphPlaying(false);\n    setMorphEnabled(true);\n    setMorphProgress(0);\n    try {\n      const result = await recordCanvasAnimation({\n        canvas,\n        durationSeconds: morphDuration,\n        frameRate: 60,\n        onProgress: setMorphProgress,\n      });\n      downloadBlob(result.blob, `${safeFileStem(sourceLabel)}-to-${safeFileStem(morphLabel || "morph")}-${rendererMode}.${result.extension}`);\n      setAnimationExportSucceeded(true);\n    } catch (error) {\n      setAnimationExportSucceeded(false);\n      setAnimationExportError(error instanceof Error && error.message === "animation-export-unsupported" ? t("export.animationUnsupported") : t("export.animationFailed"));\n    } finally {\n      setMorphProgress(1);\n      setAnimationExporting(false);\n    }\n  };\n'''
          new_export = '''  const exportShortAnimation = async () => {\n    const canvas = previewCanvas.current;\n    if (!canvas || rendererMode === "original" || isVideoSource) return;\n    const hasMorphTarget = Boolean(field && morphField);\n    const animateMorph = hasMorphTarget && (morphEnabled || motionMode === "static");\n    const animateMotion = motionMode !== "static";\n    if (!animateMorph && !animateMotion) return;\n    const capability = getCanvasRecordingCapability(canvas);\n    setAnimationCapability(capability);\n    if (!capability.supported) {\n      setAnimationExportError(t("export.animationUnsupported"));\n      setAnimationExportSucceeded(false);\n      return;\n    }\n    setAnimationExportError(null);\n    setAnimationExportSucceeded(false);\n    setAnimationExporting(true);\n    setMorphPlaying(false);\n    if (animateMorph) {\n      setMorphEnabled(true);\n      setMorphProgress(0);\n    }\n    try {\n      const result = await recordCanvasAnimation({\n        canvas,\n        durationSeconds: animateMorph ? morphDuration : motionDuration,\n        frameRate: 60,\n        onProgress: animateMorph ? setMorphProgress : () => {},\n      });\n      const fileName = animateMorph\n        ? `${safeFileStem(sourceLabel)}-to-${safeFileStem(morphLabel || "morph")}-${rendererMode}.${result.extension}`\n        : `${safeFileStem(sourceLabel)}-${rendererMode}-${motionMode}-motion.${result.extension}`;\n      downloadBlob(result.blob, fileName);\n      setAnimationExportSucceeded(true);\n    } catch (error) {\n      setAnimationExportSucceeded(false);\n      setAnimationExportError(error instanceof Error && error.message === "animation-export-unsupported" ? t("export.animationUnsupported") : t("export.animationFailed"));\n    } finally {\n      if (animateMorph) setMorphProgress(1);\n      setAnimationExporting(false);\n    }\n  };\n'''
          replace(main, old_export, new_export)

          replace(main,
              '  const canExportAnimation = canMorph && rendererMode !== "original" && animationCapability.supported && !animationExporting;\n',
              '  const hasMotionAnimation = motionMode !== "static" && !isVideoSource;\n  const canExportAnimation = (canMorph || hasMotionAnimation) && rendererMode !== "original" && !isVideoSource && animationCapability.supported && !animationExporting;\n  const motionOnlyExport = hasMotionAnimation && !(canMorph && morphEnabled);\n')

          old_motion = '''{motionMode !== "static" && <><label>{t("motion.strength")}<div className="range-row"><input aria-label={t("motion.strength")} type="range" min="0" max="200" value={Math.round(motionStrength * 100)} disabled={animationExporting} onChange={(e) => setMotionStrength(Number(e.target.value) / 100)} /><output>{Math.round(motionStrength * 100)}%</output></div></label><label>{t("motion.speed")}<div className="range-row"><input aria-label={t("motion.speed")} type="range" min="25" max="300" value={Math.round(motionSpeed * 100)} disabled={animationExporting} onChange={(e) => setMotionSpeed(Number(e.target.value) / 100)} /><output>{motionSpeed.toFixed(2)}×</output></div></label></>}'''
          new_motion = '''{motionMode !== "static" && <><label>{t("motion.strength")}<div className="range-row"><input aria-label={t("motion.strength")} type="range" min="0" max="200" value={Math.round(motionStrength * 100)} disabled={animationExporting} onChange={(e) => setMotionStrength(Number(e.target.value) / 100)} /><output>{Math.round(motionStrength * 100)}%</output></div></label><label>{t("motion.speed")}<div className="range-row"><input aria-label={t("motion.speed")} type="range" min="25" max="300" value={Math.round(motionSpeed * 100)} disabled={animationExporting} onChange={(e) => setMotionSpeed(Number(e.target.value) / 100)} /><output>{motionSpeed.toFixed(2)}×</output></div></label><label>{t("motion.duration")}<div className="range-row"><input aria-label={t("motion.duration")} type="range" min="1" max="12" step="0.5" value={motionDuration} disabled={animationExporting} onChange={(e) => setMotionDuration(Number(e.target.value))} /><output>{motionDuration} {t("morph.seconds")}</output></div></label></>}'''
          replace(main, old_motion, new_motion)

          old_export_ui = '''<section className="inspector-section"><h2>{t("export.animation")}</h2><p>{isVideoSource ? t("export.videoLongExportLater") : animationExportError ?? (animationExportSucceeded ? t("export.animationSaved") : t("export.animationHint"))}</p><label>{t("export.animationSupportedFormat")}<code>{animationFormatLabel}</code></label><button className="source-add" disabled={!canExportAnimation} onClick={() => void exportMorphAnimation()}>{animationExporting ? t("export.animationRecording") : t("export.animationButton")}</button></section>'''
          new_export_ui = '''<section className="inspector-section"><h2>{t("export.animation")}</h2><p>{isVideoSource ? t("export.videoLongExportLater") : animationExportError ?? (animationExportSucceeded ? (motionOnlyExport ? t("export.motionAnimationSaved") : t("export.animationSaved")) : (motionOnlyExport ? t("export.motionAnimationHint") : t("export.animationHint")))}</p><label>{t("export.animationSupportedFormat")}<code>{animationFormatLabel}</code></label><button className="source-add" disabled={!canExportAnimation} onClick={() => void exportShortAnimation()}>{animationExporting ? t("export.animationRecording") : motionOnlyExport ? t("export.motionAnimationButton") : t("export.animationButton")}</button></section>'''
          replace(main, old_export_ui, new_export_ui)

          en = "apps/web/src/i18n/locales/en.ts"
          replace(en,
              '  "motion.speed": "Speed",\n',
              '  "motion.speed": "Speed",\n  "motion.duration": "Animation duration",\n')
          replace(en,
              '  "export.animationButton": "Export Morph animation",\n',
              '  "export.animationButton": "Export Morph animation",\n  "export.motionAnimationHint": "Records the selected Motion locally using this browser\'s supported video format.",\n  "export.motionAnimationButton": "Export Motion animation",\n  "export.motionAnimationSaved": "Motion animation file created.",\n')

          ja = "apps/web/src/i18n/locales/ja.ts"
          replace(ja,
              '  "motion.speed": "速度",\n',
              '  "motion.speed": "速度",\n  "motion.duration": "アニメーション時間",\n')
          replace(ja,
              '  "export.animationButton": "モーフ動画を保存",\n',
              '  "export.animationButton": "モーフ動画を保存",\n  "export.motionAnimationHint": "選択した動きを、このブラウザが対応する動画形式で端末内に録画します。",\n  "export.motionAnimationButton": "動きの動画を保存",\n  "export.motionAnimationSaved": "動きの動画ファイルを作成しました。",\n')
          PY
          rm .github/workflows/stage5-motion-export-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Stage 5: export Motion-only animations"
          git push
