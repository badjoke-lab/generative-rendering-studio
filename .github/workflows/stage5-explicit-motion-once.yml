name: stage5-explicit-motion-once

on:
  push:
    branches:
      - stage5/explicit-motion-ui
    paths:
      - .github/workflows/stage5-explicit-motion-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/explicit-motion-ui
      - name: Wire explicit Motion controls
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          webgl = "apps/web/src/webgl/WebGLPreview.tsx"
          replace(webgl,
              'export type PreviewRendererMode = "point" | "glyph" | "particle";\n',
              'export type PreviewRendererMode = "point" | "glyph" | "particle";\nexport type PreviewMotionMode = "static" | "pulse" | "drift";\n')
          replace(webgl,
              'uniform float u_point_size;\nuniform float u_morph_progress;\n',
              'uniform float u_time;\nuniform float u_point_size;\nuniform float u_morph_progress;\nuniform int u_motion_mode;\nuniform float u_motion_strength;\nuniform float u_motion_speed;\n')
          replace(webgl,
              '  vec4 sourceColor = mix(a_color, a_target_color, morph);\n  vec2 p = sourcePosition * 0.94 * u_view_scale;\n',
              '  vec4 sourceColor = mix(a_color, a_target_color, morph);\n  float motionTime = u_time * max(0.05, u_motion_speed);\n  float wave = sin(motionTime * 1.4 + sourcePosition.x * 8.0 + sourcePosition.y * 5.0);\n  float pulse = u_motion_mode == 1 ? 0.018 * u_motion_strength * wave : 0.0;\n  vec2 drift = u_motion_mode == 2 ? vec2(cos(motionTime + sourcePosition.y * 9.0), sin(motionTime * 0.8 + sourcePosition.x * 7.0)) * 0.008 * u_motion_strength : vec2(0.0);\n  vec2 p = (sourcePosition * (0.94 + pulse) + drift) * u_view_scale;\n')
          replace(webgl,
              '  mode = "point",\n  elementSize = 1,\n',
              '  mode = "point",\n  motionMode = "static",\n  motionStrength = 1,\n  motionSpeed = 1,\n  elementSize = 1,\n')
          replace(webgl,
              '  mode?: PreviewRendererMode;\n  elementSize?: number;\n',
              '  mode?: PreviewRendererMode;\n  motionMode?: PreviewMotionMode;\n  motionStrength?: number;\n  motionSpeed?: number;\n  elementSize?: number;\n')
          replace(webgl,
              '    const pointSize = gl.getUniformLocation(program, "u_point_size");\n    const morph = gl.getUniformLocation(program, "u_morph_progress");\n',
              '    const time = gl.getUniformLocation(program, "u_time");\n    const pointSize = gl.getUniformLocation(program, "u_point_size");\n    const morph = gl.getUniformLocation(program, "u_morph_progress");\n    const motionModeUniform = gl.getUniformLocation(program, "u_motion_mode");\n    const motionStrengthUniform = gl.getUniformLocation(program, "u_motion_strength");\n    const motionSpeedUniform = gl.getUniformLocation(program, "u_motion_speed");\n')
          replace(webgl,
              '    const render = () => {\n',
              '    const render = (now: number) => {\n')
          replace(webgl,
              '      gl.useProgram(program);\n      gl.uniform1f(morph, Math.min(1, Math.max(0, morphProgressRef.current)));\n',
              '      gl.useProgram(program);\n      gl.uniform1f(time, now / 1000);\n      gl.uniform1f(morph, Math.min(1, Math.max(0, morphProgressRef.current)));\n      gl.uniform1i(motionModeUniform, motionMode === "pulse" ? 1 : motionMode === "drift" ? 2 : 0);\n      gl.uniform1f(motionStrengthUniform, Math.max(0, motionStrength));\n      gl.uniform1f(motionSpeedUniform, Math.max(0.05, motionSpeed));\n')
          replace(webgl,
              '  }, [background, canvasRef, colors, elementSize, glyphPreset, mode, positions, targetColors, targetPositions, tint, transparentBackground, useSourceColor]);\n',
              '  }, [background, canvasRef, colors, elementSize, glyphPreset, mode, motionMode, motionSpeed, motionStrength, positions, targetColors, targetPositions, tint, transparentBackground, useSourceColor]);\n')

          composite = "apps/web/src/canvas/VideoCompositePreview.tsx"
          replace(composite,
              'import { WebGLPreview, type GlyphPreset, type PreviewRendererMode } from "../webgl/WebGLPreview";\n',
              'import { WebGLPreview, type GlyphPreset, type PreviewMotionMode, type PreviewRendererMode } from "../webgl/WebGLPreview";\n')
          replace(composite,
              '  mode,\n  elementSize,\n',
              '  mode,\n  motionMode,\n  motionStrength,\n  motionSpeed,\n  elementSize,\n')
          replace(composite,
              '  mode: PreviewRendererMode;\n  elementSize: number;\n',
              '  mode: PreviewRendererMode;\n  motionMode: PreviewMotionMode;\n  motionStrength: number;\n  motionSpeed: number;\n  elementSize: number;\n')
          replace(composite,
              '          mode={mode}\n          elementSize={elementSize}\n',
              '          mode={mode}\n          motionMode={motionMode}\n          motionStrength={motionStrength}\n          motionSpeed={motionSpeed}\n          elementSize={elementSize}\n')

          main = "apps/web/src/main.tsx"
          replace(main,
              'import { WebGLPreview, type GlyphPreset, type PreviewRendererMode } from "./webgl/WebGLPreview";\n',
              'import { WebGLPreview, type GlyphPreset, type PreviewMotionMode, type PreviewRendererMode } from "./webgl/WebGLPreview";\n')
          replace(main,
              '  const [rendererMode, setRendererMode] = useState<StudioRendererMode>("point");\n',
              '  const [rendererMode, setRendererMode] = useState<StudioRendererMode>("point");\n  const [motionMode, setMotionMode] = useState<PreviewMotionMode>("static");\n  const [motionStrength, setMotionStrength] = useState(1);\n  const [motionSpeed, setMotionSpeed] = useState(1);\n')
          replace(main,
              'mode={rendererMode} elementSize={effectiveElementSize}',
              'mode={rendererMode} motionMode={motionMode} motionStrength={motionStrength} motionSpeed={motionSpeed} elementSize={effectiveElementSize}')
          replace(main,
              'mode={rendererMode} elementSize={effectiveElementSize}',
              'mode={rendererMode} motionMode={motionMode} motionStrength={motionStrength} motionSpeed={motionSpeed} elementSize={effectiveElementSize}')
          morph_marker = '        <section className="inspector-section guided-section"><div className="section-guide"><span className="step-badge">3</span><div><h2>{t("morph.title")}</h2>'
          motion_section = '''        {rendererMode !== "original" && <section className="inspector-section" data-stage5-motion="true"><h2>{t("motion.title")}</h2><p>{t("motion.hint")}</p><label>{t("motion.type")}<select aria-label={t("motion.type")} value={motionMode} disabled={animationExporting} onChange={(e) => setMotionMode(e.target.value as PreviewMotionMode)}><option value="static">{t("motion.static")}</option><option value="pulse">{t("motion.pulse")}</option><option value="drift">{t("motion.drift")}</option></select></label>{motionMode !== "static" && <><label>{t("motion.strength")}<div className="range-row"><input aria-label={t("motion.strength")} type="range" min="0" max="200" value={Math.round(motionStrength * 100)} disabled={animationExporting} onChange={(e) => setMotionStrength(Number(e.target.value) / 100)} /><output>{Math.round(motionStrength * 100)}%</output></div></label><label>{t("motion.speed")}<div className="range-row"><input aria-label={t("motion.speed")} type="range" min="25" max="300" value={Math.round(motionSpeed * 100)} disabled={animationExporting} onChange={(e) => setMotionSpeed(Number(e.target.value) / 100)} /><output>{motionSpeed.toFixed(2)}×</output></div></label></>}</section>}\n'''
          replace(main, morph_marker, motion_section + morph_marker)

          en = "apps/web/src/i18n/locales/en.ts"
          replace(en,
              '  "inspector.background": "Background",\n',
              '  "inspector.background": "Background",\n  "motion.title": "Motion",\n  "motion.hint": "Static by default. Choose a motion only when you want the rendered elements to move.",\n  "motion.type": "Motion type",\n  "motion.static": "Static",\n  "motion.pulse": "Pulse",\n  "motion.drift": "Drift",\n  "motion.strength": "Strength",\n  "motion.speed": "Speed",\n')

          ja = "apps/web/src/i18n/locales/ja.ts"
          replace(ja,
              '  "inspector.background": "背景",\n',
              '  "inspector.background": "背景",\n  "motion.title": "動き",\n  "motion.hint": "初期状態は静止です。動かしたいときだけ動きを選びます。",\n  "motion.type": "動きの種類",\n  "motion.static": "静止",\n  "motion.pulse": "脈動",\n  "motion.drift": "漂う",\n  "motion.strength": "強さ",\n  "motion.speed": "速度",\n')
          PY
          rm .github/workflows/stage5-explicit-motion-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Stage 5: add explicit Motion controls"
          git push
