name: stage5-layer-opacity-keyframes-once

on:
  push:
    branches:
      - stage5/layer-opacity-keyframes

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/layer-opacity-keyframes
      - name: Apply layer opacity keyframe integration
        run: python scripts/stage5_layer_opacity_keyframes_once.py
      - name: Remove one-shot files and commit implementation
        run: |
          rm .github/workflows/stage5-layer-opacity-keyframes-once.yml
          rm scripts/stage5_layer_opacity_keyframes_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage 5: keyframe Original layer opacity"
          git push origin HEAD:stage5/layer-opacity-keyframes
