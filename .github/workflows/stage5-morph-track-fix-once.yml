name: stage5-morph-track-fix-once

on:
  push:
    branches: [stage5/morph-track]
    paths:
      - .github/workflows/stage5-morph-track-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage5/morph-track
          fetch-depth: 0
      - name: Fix export duration scope and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/main.tsx')
          text = path.read_text()
          old = '''    try:\n      const durationSeconds = animateParameterTimeline\n        ? Math.max(0.001, animateMorph ? morphDuration : 0, animateCamera ? cameraDuration : 0, animateMotion && motionKeyframesEnabled ? motionDuration : 0)\n        : motionDuration;\n      const result = await recordCanvasAnimation({'''.replace('try:', 'try {')
          new = '''    const durationSeconds = animateParameterTimeline\n      ? Math.max(0.001, animateMorph ? morphDuration : 0, animateCamera ? cameraDuration : 0, animateMotion && motionKeyframesEnabled ? motionDuration : 0)\n      : motionDuration;\n    try {\n      const result = await recordCanvasAnimation({'''
          if old not in text:
              raise SystemExit('expected export duration block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/stage5-morph-track-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/main.tsx
          git commit -m "Fix Morph track export duration scope"
          git push origin HEAD:stage5/morph-track
