name: stage4-split-procedural-types-once

on:
  push:
    paths:
      - .github/workflows/stage4-split-procedural-types-once.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4/flow-noise-core
      - name: Split published primitive subset from full procedural kind union
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('packages/core/src/procedural.ts')
          text = core.read_text()
          old = '''export type ProceduralSourceKind =\n  | "sphere"\n  | "torus"\n  | "grid"\n  | "spiral"\n  | "wave"\n  | "ribbon"\n  | "vortex"\n  | "noise";'''
          new = '''export type PrimitiveProceduralSourceKind = "sphere" | "torus" | "grid" | "spiral";\nexport type FlowNoiseProceduralSourceKind = "wave" | "ribbon" | "vortex" | "noise";\nexport type ProceduralSourceKind = PrimitiveProceduralSourceKind | FlowNoiseProceduralSourceKind;'''
          if text.count(old) != 1:
              raise SystemExit(f'core type block matches: {text.count(old)}')
          core.write_text(text.replace(old, new, 1))

          main = Path('apps/web/src/main.tsx')
          text = main.read_text()
          count = text.count('ProceduralSourceKind')
          if count != 4:
              raise SystemExit(f'expected 4 main ProceduralSourceKind refs, found {count}')
          main.write_text(text.replace('ProceduralSourceKind', 'PrimitiveProceduralSourceKind'))

          panel = Path('apps/web/src/procedural/ProceduralSourcePanel.tsx')
          text = panel.read_text()
          count = text.count('ProceduralSourceKind')
          if count != 4:
              raise SystemExit(f'expected 4 panel ProceduralSourceKind refs, found {count}')
          panel.write_text(text.replace('ProceduralSourceKind', 'PrimitiveProceduralSourceKind'))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/stage4-split-procedural-types-once.yml
      - name: Commit type split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/procedural.ts apps/web/src/main.tsx apps/web/src/procedural/ProceduralSourcePanel.tsx .github/workflows/stage4-split-procedural-types-once.yml
          git commit -m "Separate primitive procedural UI kinds"
          git push origin HEAD:stage4/flow-noise-core
