name: stage4-polish-procedural-state-once

on:
  push:
    paths:
      - .github/workflows/stage4-polish-procedural-state-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4/procedural-source-ui
      - name: Polish procedural source behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/main.tsx')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:140]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '  const [sourceKind, setSourceKind] = useState<SourceKind>("still");',
              '  const [sourceKind, setSourceKind] = useState<SourceKind>("still");\n  const [proceduralSourceKind, setProceduralSourceKind] = useState<ProceduralSourceKind>();'
          )
          replace_once(
              '  useEffect(() => {\n    if (!raster && sourceKind !== "procedural") setSourceDetail(t("source.fallbackDetail"));\n  }, [locale, raster, sourceKind, t]);',
              '''  useEffect(() => {\n    if (!raster && sourceKind !== "procedural") setSourceDetail(t("source.fallbackDetail"));\n    if (sourceKind === "procedural" && proceduralSourceKind) {\n      switch (proceduralSourceKind) {\n        case "sphere": setSourceLabel(t("procedural.sphere")); break;\n        case "torus": setSourceLabel(t("procedural.torus")); break;\n        case "grid": setSourceLabel(t("procedural.grid")); break;\n        case "spiral": setSourceLabel(t("procedural.spiral")); break;\n      }\n    }\n  }, [locale, proceduralSourceKind, raster, sourceKind, t]);'''
          )
          replace_once(
              '  const isProceduralSource = sourceKind === "procedural";\n  const hasSource = Boolean(raster || (isProceduralSource && field));\n  const isVideoSource = sourceKind === "video";\n  const texturedField = useMemo(() => {\n    if (!field || !isVideoSource || !textureRaster) return field;\n    return applyRasterTextureToPointField(field, textureRaster);\n  }, [field, isVideoSource, textureRaster]);',
              '''  const isProceduralSource = sourceKind === "procedural";\n  const hasSource = Boolean(raster || (isProceduralSource && field));\n  const isVideoSource = sourceKind === "video";\n  const densityAdjustedField = useMemo(() => {\n    if (!field || !isProceduralSource) return field;\n    const visibleCount = Math.max(16, Math.min(field.samples.length, Math.round(field.samples.length * density / 100)));\n    if (visibleCount >= field.samples.length) return field;\n    const samples = Array.from({ length: visibleCount }, (_, index) =>\n      field.samples[Math.min(field.samples.length - 1, Math.floor(index * field.samples.length / visibleCount))]!,\n    );\n    return { ...field, samples };\n  }, [density, field, isProceduralSource]);\n  const texturedField = useMemo(() => {\n    if (!densityAdjustedField || !isVideoSource || !textureRaster) return densityAdjustedField;\n    return applyRasterTextureToPointField(densityAdjustedField, textureRaster);\n  }, [densityAdjustedField, isVideoSource, textureRaster]);'''
          )
          replace_once(
              '  const morphPacked = useMemo(() => {\n    if (!field || !morphField) return undefined;\n    return morphMappingToFloat32(createMorphMapping(field, morphField));\n  }, [field, morphField]);',
              '  const morphPacked = useMemo(() => {\n    if (!densityAdjustedField || !morphField) return undefined;\n    return morphMappingToFloat32(createMorphMapping(densityAdjustedField, morphField));\n  }, [densityAdjustedField, morphField]);'
          )
          replace_once(
              '    setSourceKind("procedural");\n    setRaster(undefined);',
              '    setSourceKind("procedural");\n    setProceduralSourceKind(kind);\n    setRaster(undefined);'
          )
          replace_once(
              'value={edgeWeight} disabled={animationExporting}',
              'value={edgeWeight} disabled={animationExporting || isProceduralSource}'
          )
          replace_once(
              'value={ditherStrength} disabled={animationExporting}',
              'value={ditherStrength} disabled={animationExporting || isProceduralSource}'
          )

          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/stage4-polish-procedural-state-once.yml
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx .github/workflows/stage4-polish-procedural-state-once.yml
          git commit -m "Polish procedural source behavior"
          git push origin HEAD:stage4/procedural-source-ui
